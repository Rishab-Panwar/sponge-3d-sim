<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Backdrop</title>
<!-- Generates assets/mars_bg.jpg, the results page background. Render it with:
     chrome --headless=new --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1920,1080
            --virtual-time-budget=5000 --screenshot=mars_bg.png assets/mars_scene.html
     then mirror it horizontally (rover on the right, away from the hero text).
     (procedural terrain + a rover built from primitives; scenery only) -->
<style>html,body{margin:0;background:#c98e6a;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="view"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  const scene = new THREE.Scene();
  const SKY = 0xc98e6a;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 45, 150);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
  camera.position.set(6, 6.5, 30); camera.lookAt(-5, 3, 0);
  scene.add(new THREE.HemisphereLight(0xffd9bd, 0x4a1d0e, 0.65));
  const sun = new THREE.DirectionalLight(0xfff1e0, 0.85); sun.position.set(10, 16, 8); scene.add(sun);

  // value noise for the terrain (deterministic, no textures needed)
  const fract = v => v - Math.floor(v);
  const hash = (x, z) => fract(Math.sin(x * 127.1 + z * 311.7) * 43758.5453);
  const smooth = t => t * t * (3 - 2 * t);
  function vnoise(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z), xf = smooth(x - xi), zf = smooth(z - zi);
    const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
    return a + (b - a) * xf + (c - a) * zf + (a - b - c + d) * xf * zf;
  }
  function terrainH(x, z) {
    let h = 0, amp = 3.2, f = 0.035;
    for (let o = 0; o < 4; o++) { h += amp * (vnoise(x * f, z * f) - 0.5); amp *= 0.45; f *= 2.2; }
    const r = Math.hypot(x, z);
    const flat = Math.min(1, Math.max(0, (r - 9) / 12));   // flat pad around the sponge
    return h * flat * flat - 0.03;
  }
  const tg = new THREE.PlaneGeometry(260, 260, 180, 180);
  tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position, cols = [];
  const cA = new THREE.Color(0x8c3a1b), cB = new THREE.Color(0xb5562a), cC = new THREE.Color(0x6e2c14);
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i), h = terrainH(x, z);
    tp.setY(i, h);
    const n = vnoise(x * 0.3 + 50, z * 0.3 - 20);
    const c = cA.clone().lerp(cB, n).lerp(cC, Math.min(1, Math.max(0, -h * 0.4)));
    cols.push(c.r, c.g, c.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  const ground = new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(ground);

  // scattered rocks (kept away from the sponge)
  const rockMat = new THREE.MeshLambertMaterial({ color: 0x5e2a17 });
  for (let i = 0; i < 70; i++) {
    const ang = hash(i, 1) * Math.PI * 2, r = 10 + hash(i, 2) * 60;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r, s = 0.25 + hash(i, 3) * (r > 25 ? 2.2 : 0.8);
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    rock.position.set(x, terrainH(x, z) + s * 0.3, z);
    rock.rotation.set(hash(i, 4) * 3, hash(i, 5) * 3, 0);
    rock.scale.y = 0.55 + hash(i, 6) * 0.4;
    scene.add(rock);
  }

  // a simple rover built from primitives, parked behind the sponge
  (function rover() {
    const g = new THREE.Group();
    const white = new THREE.MeshLambertMaterial({ color: 0xd9d4ca });
    const dark = new THREE.MeshLambertMaterial({ color: 0x2a2a2c });
    const metal = new THREE.MeshLambertMaterial({ color: 0x8f8f93 });
    const panel = new THREE.MeshLambertMaterial({ color: 0x1d2944 });
    const gold = new THREE.MeshLambertMaterial({ color: 0xc9a227 });
    const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); g.add(b); return b; };
    box(6.2, 1.4, 3.8, white, 0, 2.5, 0);                 // body
    box(6.6, 0.12, 4.4, panel, 0, 3.3, 0);                // solar deck
    for (const sx of [-2.6, 0, 2.6]) for (const sz of [-2.35, 2.35]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.7, 20), dark);
      w.rotation.x = Math.PI / 2; w.position.set(sx, 0.85, sz); g.add(w);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.75, 12), metal);
      hub.rotation.x = Math.PI / 2; hub.position.set(sx, 0.85, sz); g.add(hub);
    }
    for (const sz of [-2.0, 2.0]) {                       // rocker-bogie arms
      const arm = box(5.6, 0.25, 0.25, metal, 0, 1.7, sz); arm.rotation.z = 0.05;
      box(0.25, 1.1, 0.25, metal, -2.6, 1.3, sz); box(0.25, 1.1, 0.25, metal, 2.6, 1.3, sz);
    }
    box(0.3, 3.4, 0.3, white, 2.3, 5.0, -1.1);            // mast
    box(1.3, 0.7, 0.8, white, 2.3, 6.9, -1.1);            // camera head
    for (const dz of [-0.25, 0.25]) {
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 12), dark);
      lens.rotation.z = Math.PI / 2; lens.position.set(3.0, 6.9, -1.1 + dz); g.add(lens);
    }
    const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.12, 24), gold);
    dish.position.set(-1.6, 3.9, 1.2); dish.rotation.z = 0.5; g.add(dish);
    box(0.12, 1.6, 0.12, metal, -2.6, 4.0, -1.4);         // antenna
    const x = -16, z = 1;                                 // left of the sponge in the default view
    g.position.set(x, terrainH(x, z), z);
    g.rotation.y = 0.35;                                  // camera mast turned toward the sponge
    scene.add(g);
  })();

  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
