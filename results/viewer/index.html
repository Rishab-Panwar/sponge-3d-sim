<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sponge 3D Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f3ee; --panel:#f9f8f4; --ink:#17191d; --muted:#64665f; --line:#d6d2c9; --accent:#ff7900;
          --font-body:"Inter", system-ui, sans-serif; --font-data:"DM Mono", ui-monospace, monospace; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d131c; --panel:#131b26; --ink:#e8eaed; --muted:#9aa1ab; --line:#263142; }
  }
  :root[data-theme="dark"] { --bg:#0d131c; --panel:#131b26; --ink:#e8eaed; --muted:#9aa1ab; --line:#263142; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--font-body); -webkit-font-smoothing:antialiased; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:17px; margin:0 0 2px; letter-spacing:-0.02em; font-weight:600; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  #view { width:100%; height:calc(100vh - 210px); min-height:320px; display:block; }  /* fill the window / embed frame */
  .controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:12px 16px;
              background:var(--panel); border-top:1px solid var(--line); }
  .controls label { color:var(--muted); font:500 11px/1 var(--font-data); letter-spacing:.08em; text-transform:uppercase; }
  #tlabel { font:13px var(--font-data); color:var(--muted); }
  select, button { font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:999px;
                   background:var(--bg); color:var(--ink); cursor:pointer; }
  button#play { background:var(--accent); border-color:var(--accent); color:#17191d; font-weight:500; }
  input[type=range] { flex:1 1 220px; min-width:160px; accent-color:var(--accent); }
  .info { padding:10px 16px 16px; color:var(--muted); font-size:13px; }
  .info b { color:var(--ink); }
  .key span { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 4px 0 10px; vertical-align:middle; }
  #err { padding:24px 16px; color:#c00; display:none; }
</style>
</head>
<body>
<header>
  <h1>Sponge: fitted 3D deformation model</h1>
  <p>3D mass-spring model, driven only by the tracked phone motion. Drag to rotate, scroll to zoom.</p>
</header>
<canvas id="view"></canvas>
<div class="controls">
  <label>Clip <select id="clip"></select></label>
  <button id="play">Pause</button>
  <label>Speed <select id="speed"><option value="0.0625">1/16x</option><option value="0.125" selected>1/8x</option><option value="0.25">1/4x</option><option value="1">1x</option></select></label>
  <input id="time" type="range" min="0" max="0" value="0">
  <span id="tlabel">t = 0.000 s</span>
</div>
<div class="info">
  <div id="clipinfo"></div>
  <div class="key"><span style="background:#ff7900"></span>real dot (tracked)<span style="background:#1f6feb"></span>simulated dot<span style="background:#555"></span>phone plate</div>
</div>
<div id="err">Could not load data.js. Run <code>python src/export_viewer.py</code> first, and keep data.js next to this file.</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const D = window.SPONGE_DATA;
  if (!D || !window.THREE) { document.getElementById('err').style.display = 'block'; return; }
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  const scene = new THREE.Scene();
  // ---------------- Mars-like scene: dusty sky, rust terrain, rocks, a rover ----------------
  const SKY = 0xc98e6a;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 45, 150);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
  camera.position.set(14, 10, 22);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 4.5, 0);
  controls.maxPolarAngle = Math.PI / 2 - 0.04;      // stay above the ground
  controls.maxDistance = 90;
  controls.update();
  scene.add(new THREE.HemisphereLight(0xffd9bd, 0x4a1d0e, 0.65));
  const sun = new THREE.DirectionalLight(0xfff1e0, 0.85); sun.position.set(10, 16, 8); scene.add(sun);

  // value noise for the terrain (deterministic, no textures needed)
  const fract = v => v - Math.floor(v);
  const hash = (x, z) => fract(Math.sin(x * 127.1 + z * 311.7) * 43758.5453);
  const smooth = t => t * t * (3 - 2 * t);
  function vnoise(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z), xf = smooth(x - xi), zf = smooth(z - zi);
    const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
    return a + (b - a) * xf + (c - a) * zf + (a - b - c + d) * xf * zf;
  }
  function terrainH(x, z) {
    let h = 0, amp = 3.2, f = 0.035;
    for (let o = 0; o < 4; o++) { h += amp * (vnoise(x * f, z * f) - 0.5); amp *= 0.45; f *= 2.2; }
    const r = Math.hypot(x, z);
    const flat = Math.min(1, Math.max(0, (r - 9) / 12));   // flat pad around the sponge
    return h * flat * flat - 0.03;
  }
  const tg = new THREE.PlaneGeometry(260, 260, 180, 180);
  tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position, cols = [];
  const cA = new THREE.Color(0x8c3a1b), cB = new THREE.Color(0xb5562a), cC = new THREE.Color(0x6e2c14);
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i), h = terrainH(x, z);
    tp.setY(i, h);
    const n = vnoise(x * 0.3 + 50, z * 0.3 - 20);
    const c = cA.clone().lerp(cB, n).lerp(cC, Math.min(1, Math.max(0, -h * 0.4)));
    cols.push(c.r, c.g, c.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  tg.computeVertexNormals();
  const ground = new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(ground);

  // scattered rocks (kept away from the sponge)
  const rockMat = new THREE.MeshLambertMaterial({ color: 0x5e2a17 });
  for (let i = 0; i < 70; i++) {
    const ang = hash(i, 1) * Math.PI * 2, r = 10 + hash(i, 2) * 60;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r, s = 0.25 + hash(i, 3) * (r > 25 ? 2.2 : 0.8);
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    rock.position.set(x, terrainH(x, z) + s * 0.3, z);
    rock.rotation.set(hash(i, 4) * 3, hash(i, 5) * 3, 0);
    rock.scale.y = 0.55 + hash(i, 6) * 0.4;
    scene.add(rock);
  }

  // a simple rover built from primitives, parked behind the sponge
  (function rover() {
    const g = new THREE.Group();
    const white = new THREE.MeshLambertMaterial({ color: 0xd9d4ca });
    const dark = new THREE.MeshLambertMaterial({ color: 0x2a2a2c });
    const metal = new THREE.MeshLambertMaterial({ color: 0x8f8f93 });
    const panel = new THREE.MeshLambertMaterial({ color: 0x1d2944 });
    const gold = new THREE.MeshLambertMaterial({ color: 0xc9a227 });
    const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); g.add(b); return b; };
    box(6.2, 1.4, 3.8, white, 0, 2.5, 0);                 // body
    box(6.6, 0.12, 4.4, panel, 0, 3.3, 0);                // solar deck
    for (const sx of [-2.6, 0, 2.6]) for (const sz of [-2.35, 2.35]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.7, 20), dark);
      w.rotation.x = Math.PI / 2; w.position.set(sx, 0.85, sz); g.add(w);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.75, 12), metal);
      hub.rotation.x = Math.PI / 2; hub.position.set(sx, 0.85, sz); g.add(hub);
    }
    for (const sz of [-2.0, 2.0]) {                       // rocker-bogie arms
      const arm = box(5.6, 0.25, 0.25, metal, 0, 1.7, sz); arm.rotation.z = 0.05;
      box(0.25, 1.1, 0.25, metal, -2.6, 1.3, sz); box(0.25, 1.1, 0.25, metal, 2.6, 1.3, sz);
    }
    box(0.3, 3.4, 0.3, white, 2.3, 5.0, -1.1);            // mast
    box(1.3, 0.7, 0.8, white, 2.3, 6.9, -1.1);            // camera head
    for (const dz of [-0.25, 0.25]) {
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 12), dark);
      lens.rotation.z = Math.PI / 2; lens.position.set(3.0, 6.9, -1.1 + dz); g.add(lens);
    }
    const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.12, 24), gold);
    dish.position.set(-1.6, 3.9, 1.2); dish.rotation.z = 0.5; g.add(dish);
    box(0.12, 1.6, 0.12, metal, -2.6, 4.0, -1.4);         // antenna
    const x = -16, z = 1;                                 // left of the sponge in the default view
    g.position.set(x, terrainH(x, z), z);
    g.rotation.y = 0.35;                                  // camera mast turned toward the sponge
    scene.add(g);
  })();

  let sponge, edges, plate, realDots = [], simDots = [], clip, frame = 0, playing = true;
  const sel = document.getElementById('clip');
  Object.keys(D.clips).forEach(n => {
    const o = document.createElement('option'); o.value = n;
    o.textContent = n + ' (' + D.clips[n].role + ')'; sel.appendChild(o);
  });
  const testName = Object.keys(D.clips).find(n => D.clips[n].role === 'test');
  if (testName) sel.value = testName;

  function build(name) {
    clip = D.clips[name];
    [sponge, edges, plate].forEach(o => o && scene.remove(o));
    realDots.concat(simDots).forEach(o => scene.remove(o));
    realDots = []; simDots = [];
    const tris = [];
    clip.quads.forEach(q => { tris.push(q[0], q[1], q[2], q[0], q[2], q[3]); });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(clip.nodes[0].length * 3), 3));
    g.setIndex(tris);
    sponge = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0xf0d75a, side: THREE.DoubleSide }));
    scene.add(sponge);
    const lines = [];
    clip.quads.forEach(q => { for (let k = 0; k < 4; k++) lines.push(q[k], q[(k + 1) % 4]); });
    const eg = new THREE.BufferGeometry();
    eg.setAttribute('position', g.getAttribute('position'));
    eg.setIndex(lines);
    edges = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x8a6d1a }));
    scene.add(edges);
    plate = new THREE.Mesh(new THREE.BoxGeometry(9, 0.25, clip.depth + 1.6),
      new THREE.MeshLambertMaterial({ color: 0x444444, transparent: true, opacity: 0.55 }));
    scene.add(plate);
    const sph = new THREE.SphereGeometry(0.12, 12, 8);
    for (let i = 0; i < clip.real_dots[0].length; i++) {
      const r = new THREE.Mesh(sph, new THREE.MeshBasicMaterial({ color: 0xff7900 }));
      const s = new THREE.Mesh(sph, new THREE.MeshBasicMaterial({ color: 0x1f6feb }));
      scene.add(r); scene.add(s); realDots.push(r); simDots.push(s);
    }
    const slider = document.getElementById('time');
    slider.max = clip.t.length - 1; frame = 0;
    const rms = clip.rms_cm != null ? clip.rms_cm.toFixed(2) + ' cm' : 'n/a';
    document.getElementById('clipinfo').innerHTML =
      '<b>' + name + '</b>, ' + clip.role + ' clip; dot error (rms over the clip) <b>' + rms +
      '</b>; phone released at t = ' + clip.release_t.toFixed(3) + ' s.' +
      (D.effective && D.effective.wobble_frequency_hz ? ' Fitted sway: <b>' +
      D.effective.wobble_frequency_hz.toFixed(2) + ' Hz</b>, damping ratio <b>' +
      D.effective.wobble_damping_ratio.toFixed(3) + '</b>.' : '');
    show(0);
  }

  function show(f) {
    frame = f;
    const pos = sponge.geometry.getAttribute('position');
    const nd = clip.nodes[f];
    for (let i = 0; i < nd.length; i++) pos.setXYZ(i, nd[i][0], nd[i][1], nd[i][2]);
    pos.needsUpdate = true;
    sponge.geometry.computeVertexNormals();
    sponge.geometry.computeBoundingSphere();
    const zf = clip.depth / 2 + 0.05;
    clip.real_dots[f].forEach((d, i) => realDots[i].position.set(d[0], d[1], zf));
    clip.sim_dots[f].forEach((d, i) => simDots[i].position.set(d[0], d[1], zf + 0.02));
    const pl = clip.plate[f];
    plate.visible = pl[0] !== null && pl[0] < 30;
    if (plate.visible) {
      plate.position.set(0, pl[0] + 0.125, 0);
      plate.rotation.z = -Math.atan(pl[1]);
    }
    document.getElementById('time').value = f;
    const t = clip.t[f];
    document.getElementById('tlabel').textContent = 't = ' + t.toFixed(3) + ' s' +
      (t > clip.release_t ? '  (free)' : '  (pressing)');
  }

  sel.onchange = () => build(sel.value);
  document.getElementById('time').oninput = e => { show(+e.target.value); };
  document.getElementById('play').onclick = e => {
    playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play';
  };
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = (now - last) / 1000; last = now;
    if (playing && clip) {
      acc += dt * parseFloat(document.getElementById('speed').value);
      const step = clip.t[1] - clip.t[0];
      while (acc >= step) { acc -= step; show((frame + 1) % clip.t.length); }
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  build(sel.value); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
